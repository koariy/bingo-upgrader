plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories { mavenCentral() }

loom {
    splitEnvironmentSourceSets()
    mods {
        "bingo_upgrader" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    def properties = [version: project.version, minecraft_version: project.minecraft_version,
                      loader_version: project.loader_version, fabric_version: project.fabric_version]
    inputs.properties properties
    filesMatching('fabric.mod.json') { expand properties }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        mavenJava(MavenPublication) { from components.java }
    }
}

// No extra test/runtime libraries: check the solver and Minecraft components directly.
tasks.register('valueChecks', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.bingoupgrader.ValueModuleChecks'
    workingDir = layout.buildDirectory.dir('value-checks').get().asFile
    doFirst { workingDir.mkdirs() }
}
tasks.named('check') { dependsOn tasks.named('valueChecks') }
// Executable checks above replace framework discovery; no JUnit dependency is bundled.
tasks.named('test') { enabled = false }
